services:
  config:
    build: .
    restart: always
    volumes:
      # - ./:/usr/src/app
      - django-media:/usr/src/app/media
      - hub-private:/usr/src/app/private
    environment:
      DB_ENGINE: django.db.backends.postgresql
      HUB_ENCRYPTION_KEYS: ${HUB_ENCRYPTION_KEYS:-}
      HUB_OAUTH_GITHUB_CLIENT_ID: ${HUB_OAUTH_GITHUB_CLIENT_ID:-}
      HUB_OAUTH_GITHUB_CLIENT_SECRET: ${HUB_OAUTH_GITHUB_CLIENT_SECRET:-}
      HUB_OAUTH_GITLAB_CLIENT_ID: ${HUB_OAUTH_GITLAB_CLIENT_ID:-}
      HUB_OAUTH_GITLAB_CLIENT_SECRET: ${HUB_OAUTH_GITLAB_CLIENT_SECRET:-}
      HUB_OAUTH_GOOGLE_CLIENT_ID: ${HUB_OAUTH_GOOGLE_CLIENT_ID:-}
      HUB_OAUTH_GOOGLE_CLIENT_SECRET: ${HUB_OAUTH_GOOGLE_CLIENT_SECRET:-}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: config-db
      DB_PORT: 5432
    # Apply pending migrations (additive) before starting the app server.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn --chdir /usr/src/app --timeout 320 --workers 25 --access-logfile /dev/stdout --error-logfile /dev/stderr --bind :80 config.wsgi:application"
    depends_on:
      config-db:
        condition: service_healthy
    networks:
      - backend
      - dokploy-network


  config-db:
    image: postgres:17
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_MAX_CONNECTIONS: 2000
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend


  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENABLE_HTTPS: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - config-db
    networks:
      - backend
    ports:
      - "5020:80" 
    command: >
      sh -c "
        echo 'SERVER_MODE = False' > /pgadmin4/config_local.py &&
        echo 'ENABLE_HTTPS = False' >> /pgadmin4/config_local.py &&
        /entrypoint.sh
      "


volumes:
  django-media:
  hub-private:
  postgresql_data:
  pgadmin_data:


networks:
  backend:
  dokploy-network:
    external: true
