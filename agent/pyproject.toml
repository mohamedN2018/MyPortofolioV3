[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnp-agent"
version = "0.1.0"
description = "Local agent + MCP server for the Mohamed Nabil AI Hub"
requires-python = ">=3.10"
dependencies = [
  "requests==2.32.5",
  "keyring==25.6.0",
  "PyYAML==6.0.2",
  "mcp==1.30.0",
]

[project.scripts]
mnp-agent = "mnp_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
