<div class="social-links">
  {% for p in brand.profiles %}
    <a href="{{ p.url }}" target="_blank" rel="noopener noreferrer me" title="{{ p.label }}"
       aria-label="{{ brand.name }} {% if seo.lang == 'ar' %}على{% else %}on{% endif %} {{ p.label }}">
      <i class="bi {{ p.icon }}" aria-hidden="true"></i>
    </a>
  {% endfor %}
</div>

<style>
.social-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.social-links a {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: color-mix(in srgb, var(--accent-color), transparent 85%);
  color: var(--default-color);
  border-radius: 50%;
  font-size: 16px;
  transition: all 0.3s ease;
}

.social-links a:hover {
  background-color: var(--accent-color);
  color: var(--contrast-color);
  transform: translateY(-3px);
}
</style>
